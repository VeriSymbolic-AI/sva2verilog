name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint (ruff)
        run: uv run ruff check src/ tests/
      - name: Type check (mypy)
        run: uv run mypy --strict src/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        simulator: [iverilog, verilator]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Install iverilog (Linux)
        if: matrix.simulator == 'iverilog' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install iverilog (macOS)
        if: matrix.simulator == 'iverilog' && runner.os == 'macOS'
        run: brew install icarus-verilog

      - name: Install Verilator (Linux)
        if: matrix.simulator == 'verilator' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Install Verilator (macOS)
        if: matrix.simulator == 'verilator' && runner.os == 'macOS'
        run: brew install verilator

      - name: Install slang (Linux)
        if: runner.os == 'Linux'
        run: |
          SLANG_VERSION="v11.0"
          wget -q "https://github.com/MikePopoloski/slang/releases/download/${SLANG_VERSION}/slang-linux-x86_64.tar.gz"
          tar xzf slang-linux-x86_64.tar.gz
          sudo mv slang /usr/local/bin/slang
          slang --version

      - name: Install slang (macOS)
        if: runner.os == 'macOS'
        run: |
          SLANG_VERSION="v11.0"
          wget -q "https://github.com/MikePopoloski/slang/releases/download/${SLANG_VERSION}/slang-macos-arm64.tar.gz"
          tar xzf slang-macos-arm64.tar.gz
          sudo mv slang /usr/local/bin/slang
          slang --version

      - name: Run tests (iverilog — full suite)
        if: matrix.simulator == 'iverilog'
        run: uv run pytest tests/ -v --timeout=120
        env:
          SLANG_PATH: /usr/local/bin/slang

      - name: Run tests (Verilator — simulation only)
        if: matrix.simulator == 'verilator'
        run: uv run pytest tests/ -m simulation --simulator=verilator -v --timeout=120
        env:
          SLANG_PATH: /usr/local/bin/slang

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Install yosys
        run: sudo apt-get update && sudo apt-get install -y yosys z3

      - name: Install SymbiYosys (sby)
        run: |
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          sudo make -C /tmp/sby install PREFIX=/usr/local
          sby --version
          z3 --version

      - name: Install slang
        run: |
          SLANG_VERSION="v11.0"
          wget -q "https://github.com/MikePopoloski/slang/releases/download/${SLANG_VERSION}/slang-linux-x86_64.tar.gz"
          tar xzf slang-linux-x86_64.tar.gz
          sudo mv slang /usr/local/bin/slang
          slang --version

      - name: Run formal equivalence tests
        run: uv run pytest tests/test_formal_passes.py tests/test_formal_templates.py tests/test_formal_sva_equiv.py tests/test_v151_nfa_bmc.py tests/test_v151_p2_bmc.py tests/test_formal_kinduction.py -v --timeout=600
        env:
          SLANG_PATH: /usr/local/bin/slang
          SVA2RTL_FORMAL_PROVE_TIMEOUT: "90"
