name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev --frozen
      - name: Lint (ruff)
        run: uv run ruff check src/ tests/
      - name: Type check (mypy)
        run: uv run mypy --strict src/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        simulator: [iverilog, verilator]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Install iverilog (Linux)
        if: matrix.simulator == 'iverilog' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install iverilog (macOS)
        if: matrix.simulator == 'iverilog' && runner.os == 'macOS'
        run: brew install icarus-verilog

      - name: Install Verilator (Linux, pinned v5.028)
        if: matrix.simulator == 'verilator' && runner.os == 'Linux'
        run: bash tools/ci/install_verilator.sh

      - name: Install Verilator (macOS, pinned v5.028)
        if: matrix.simulator == 'verilator' && runner.os == 'macOS'
        run: bash tools/ci/install_verilator.sh

      - name: Install slang (Linux)
        if: runner.os == 'Linux'
        run: bash tools/ci/install_slang.sh

      - name: Install slang (macOS)
        if: runner.os == 'macOS'
        run: bash tools/ci/install_slang.sh

      - name: Run tests (iverilog — full suite, bounded differential included)
        if: matrix.simulator == 'iverilog'
        run: uv run pytest tests/ -v --timeout=120 --junitxml=pytest-results.xml
        env:
          SLANG_PATH: /usr/local/bin/slang

      - name: Enforce iverilog execution budget
        if: matrix.simulator == 'iverilog'
        run: >
          uv run python tools/ci/check_junit.py pytest-results.xml
          --min-passed 1200 --max-skipped 200

      - name: Run tests (Verilator — simulation + bounded differential)
        if: matrix.simulator == 'verilator'
        run: >
          uv run pytest tests/ -m "simulation and not differential_slow"
          --simulator=verilator -v --timeout=120 --junitxml=pytest-results.xml
        env:
          SLANG_PATH: /usr/local/bin/slang

      - name: Enforce Verilator execution budget
        if: matrix.simulator == 'verilator'
        run: >
          uv run python tools/ci/check_junit.py pytest-results.xml
          --min-passed 160 --max-skipped 1

  generated-rtl:
    name: generated RTL gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys

      - name: Install Verilator (pinned v5.028)
        run: bash tools/ci/install_verilator.sh

      - name: Run generated RTL synthesis and lint gates
        run: >
          uv run pytest tests/test_synthesis_gates.py tests/test_generated_lint.py
          -v --timeout=180 --junitxml=pytest-results.xml

      - name: Enforce generated RTL execution budget
        run: >
          uv run python tools/ci/check_junit.py pytest-results.xml
          --min-passed 130 --max-skipped 0

  formal:
    name: formal smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4.1.0
        with:
          version: "2026-07-21"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report formal tool versions
        run: |
          yosys --version
          sby --version
          z3 --version

      - name: Install slang
        run: bash tools/ci/install_slang.sh

      - name: Run formal smoke tests
        run: >
          uv run pytest
          tests/test_formal_passes.py::TestConstantFoldEquiv::test_constant_true_is_equivalent
          tests/test_formal_templates.py::TestBoolExprTemplate::test_simple_boolean
          tests/test_formal_sva_equiv.py::TestBoolExprSvaEquiv::test_bool_simple_equiv
          -v --timeout=120 --junitxml=pytest-results.xml
        env:
          SLANG_PATH: /usr/local/bin/slang
          SVA2RTL_FORMAL_PROVE_TIMEOUT: "30"

      - name: Enforce formal smoke execution budget
        run: >
          uv run python tools/ci/check_junit.py pytest-results.xml
          --min-passed 3 --max-skipped 0

  coverage:
    name: coverage regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install slang
        run: bash tools/ci/install_slang.sh

      - name: Run aggregate and critical-module coverage gates
        run: |
          uv run pytest tests/ --simulator=iverilog --cov=src/sva2rtl --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=82 -v --timeout=120 --junitxml=pytest-results.xml
          uv run python tools/ci/check_junit.py pytest-results.xml --min-passed 1200 --max-skipped 200
          uv run python tools/ci/check_coverage.py coverage.json
        env:
          SLANG_PATH: /usr/local/bin/slang

  python-314-package:
    name: Python 3.14 + installed distribution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          prune-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev --frozen --python 3.14

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install slang
        run: bash tools/ci/install_slang.sh

      - name: Run broad Python 3.14 compatibility suite
        run: >
          uv run --python 3.14 pytest tests/
          -m "not simulation and not synthesis and not generated_lint"
          -v --timeout=120 --junitxml=pytest-results.xml
        env:
          SLANG_PATH: /usr/local/bin/slang

      - name: Enforce Python 3.14 execution budget
        run: >
          uv run --python 3.14 python tools/ci/check_junit.py pytest-results.xml
          --min-passed 900 --max-skipped 200

      - name: Build wheel and source distribution
        run: uv build --out-dir dist

      - name: Install wheel outside the checkout and compile an SVA
        run: >
          uv run --python 3.14 python tools/ci/smoke_distribution.py
          dist/*.whl dist/*.tar.gz
