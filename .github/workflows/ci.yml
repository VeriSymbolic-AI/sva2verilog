name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint (ruff)
        run: uv run ruff check src/ tests/
      - name: Type check (mypy)
        run: uv run mypy --strict src/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        simulator: [iverilog, verilator]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Install iverilog (Linux)
        if: matrix.simulator == 'iverilog' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install iverilog (macOS)
        if: matrix.simulator == 'iverilog' && runner.os == 'macOS'
        run: brew install icarus-verilog

      - name: Install Verilator (Linux, pinned v5.028)
        if: matrix.simulator == 'verilator' && runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y autoconf build-essential
          VERILATOR_VERSION="v5.028"
          wget -q "https://github.com/verilator/verilator/archive/refs/tags/${VERILATOR_VERSION}.tar.gz"
          tar xzf ${VERILATOR_VERSION}.tar.gz
          cd verilator-5.028
          autoconf && ./configure && make -j$(nproc) && sudo make install
          verilator --version

      - name: Install Verilator (macOS, pinned v5.028)
        if: matrix.simulator == 'verilator' && runner.os == 'macOS'
        run: |
          brew install autoconf
          VERILATOR_VERSION="v5.028"
          wget -q "https://github.com/verilator/verilator/archive/refs/tags/${VERILATOR_VERSION}.tar.gz"
          tar xzf ${VERILATOR_VERSION}.tar.gz
          cd verilator-5.028
          autoconf && ./configure && make -j$(sysctl -n hw.logicalcpu) && sudo make install
          verilator --version

      - name: Install slang (Linux)
        if: runner.os == 'Linux'
        run: |
          SLANG_VERSION="v11.0"
          wget -q "https://github.com/MikePopoloski/slang/releases/download/${SLANG_VERSION}/slang-linux-x86_64.tar.gz"
          tar xzf slang-linux-x86_64.tar.gz
          sudo mv slang /usr/local/bin/slang
          slang --version

      - name: Install slang (macOS)
        if: runner.os == 'macOS'
        run: |
          SLANG_VERSION="v11.0"
          wget -q "https://github.com/MikePopoloski/slang/releases/download/${SLANG_VERSION}/slang-macos-arm64.tar.gz"
          tar xzf slang-macos-arm64.tar.gz
          sudo mv slang /usr/local/bin/slang
          slang --version

      - name: Run tests (iverilog — full suite, bounded differential included)
        if: matrix.simulator == 'iverilog'
        run: uv run pytest tests/ -v --timeout=120
        env:
          SLANG_PATH: /usr/local/bin/slang

      - name: Run tests (Verilator — simulation + bounded differential)
        if: matrix.simulator == 'verilator'
        run: uv run pytest tests/ -m "simulation and not differential_slow" --simulator=verilator -v --timeout=120
        env:
          SLANG_PATH: /usr/local/bin/slang

  generated-rtl:
    name: generated RTL gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Install generated RTL tools
        run: |
          sudo apt-get update && sudo apt-get install -y yosys autoconf build-essential
          VERILATOR_VERSION="v5.028"
          wget -q "https://github.com/verilator/verilator/archive/refs/tags/${VERILATOR_VERSION}.tar.gz"
          tar xzf ${VERILATOR_VERSION}.tar.gz
          cd verilator-5.028
          autoconf && ./configure && make -j$(nproc) && sudo make install
          verilator --version

      - name: Run generated RTL synthesis and lint gates
        run: uv run pytest tests/test_synthesis_gates.py tests/test_generated_lint.py -v --timeout=180

  formal:
    name: formal smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Install yosys
        run: sudo apt-get update && sudo apt-get install -y yosys z3

      - name: Install SymbiYosys (sby)
        run: |
          git clone --depth 1 https://github.com/YosysHQ/sby.git /tmp/sby
          sudo make -C /tmp/sby install PREFIX=/usr/local
          sby --version
          z3 --version

      - name: Install slang
        run: |
          SLANG_VERSION="v11.0"
          wget -q "https://github.com/MikePopoloski/slang/releases/download/${SLANG_VERSION}/slang-linux-x86_64.tar.gz"
          tar xzf slang-linux-x86_64.tar.gz
          sudo mv slang /usr/local/bin/slang
          slang --version

      - name: Run formal smoke tests
        run: >
          uv run pytest
          tests/test_formal_passes.py::TestConstantFoldEquiv::test_constant_true_is_equivalent
          tests/test_formal_templates.py::TestBoolExprTemplate::test_simple_boolean
          tests/test_formal_sva_equiv.py::TestBoolExprSvaEquiv::test_bool_simple_equiv
          -v --timeout=120
        env:
          SLANG_PATH: /usr/local/bin/slang
          SVA2RTL_FORMAL_PROVE_TIMEOUT: "30"
