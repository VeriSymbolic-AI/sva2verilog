name: Full Formal

on:
  workflow_dispatch:
  schedule:
    # Weekly full proof sweep. Push/PR CI keeps a shorter formal smoke gate.
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  formal:
    name: formal full (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: optimizer-and-templates
            files: tests/test_formal_passes.py tests/test_formal_templates.py
            min-passed: 35
            max-skipped: 0
          - suite: sva-core
            files: tests/test_formal_sva_equiv.py
            min-passed: 63
            max-skipped: 0
          - suite: nfa-composition
            files: tests/test_v151_nfa_bmc.py tests/test_implication_delay_window_formal.py
            min-passed: 16
            max-skipped: 0
          - suite: nfa-overlap-implication
            files: tests/test_v151_p2_bmc.py::TestOverlapImplNfaMiter
            min-passed: 3
            max-skipped: 0
          - suite: nfa-nonoverlap-implication
            files: tests/test_v151_p2_bmc.py::TestNonoverlapImplNfaMiter
            min-passed: 3
            max-skipped: 0
          - suite: kinduction
            files: tests/test_formal_kinduction.py
            min-passed: 10
            # One dynamically classified xfail documents only the bounded-liveness
            # induction-convergence boundary. Counterexamples remain hard failures.
            max-skipped: 1
          - suite: open-user-dut
            files: tests/test_formal_user_dut.py tests/test_formal_safety_rewrites.py tests/test_formal_advanced_safety.py tests/test_formal_symbolic_witness.py tests/test_formal_evidence_gates.py tests/test_formal_boundaries.py tests/test_formal_locals.py tests/test_formal_status_corpus.py tests/test_formal_project_context.py tests/test_external_rtl_corpus.py
            min-passed: 71
            max-skipped: 0
          - suite: open-liveness
            files: tests/test_formal_liveness.py
            min-passed: 14
            max-skipped: 0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          prune-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --frozen

      # Pin one coherent YosysHQ toolchain instead of mixing Ubuntu's Yosys
      # package with an unpinned SymbiYosys checkout.
      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4.1.0
        with:
          version: "2026-07-21"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report formal tool versions
        run: |
          yosys --version
          sby --version
          z3 --version
          command -v suprove

      - name: Install slang
        run: bash tools/ci/install_slang.sh

      - name: Run full formal suite shard
        run: >
          uv run pytest ${{ matrix.files }} -v --timeout=600
          --junitxml=formal-results.xml
        env:
          SLANG_PATH: /usr/local/bin/slang
          SVA2RTL_FORMAL_PROVE_TIMEOUT: "90"

      - name: Enforce formal shard execution budget
        run: >
          uv run python tools/ci/check_junit.py formal-results.xml
          --min-passed ${{ matrix.min-passed }} --max-skipped ${{ matrix.max-skipped }}
          --allow-skip-prefix "k-induction did not converge for"
