[project]
name = "sva2rtl"
version = "1.5.0"
description = "SVA to synthesizable RTL monitor compiler"
license = {text = "BSL-1.1"}
readme = "README.md"
requires-python = ">=3.12"
keywords = ["sva", "systemverilog", "assertion", "rtl", "formal", "eda", "monitor", "synthesis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0",
    "jinja2>=3.1.6",
]

[project.urls]
Homepage = "https://github.com/sva2rtl/sva2rtl"
Repository = "https://github.com/sva2rtl/sva2rtl"
Issues = "https://github.com/sva2rtl/sva2rtl/issues"

[project.scripts]
sva2rtl = "sva2rtl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sva2rtl"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=9.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN"]
ignore = ["ANN101", "ANN102", "N818"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "simulation: marks tests requiring iverilog (deselect with '-m not simulation')",
    "integration: marks end-to-end integration tests",
]
