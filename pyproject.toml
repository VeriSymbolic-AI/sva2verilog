[project]
name = "sva2rtl"
version = "1.7.1"
description = "SVA to synthesizable RTL monitor compiler"
license = {text = "BSL-1.1"}
readme = "README.md"
requires-python = ">=3.12"
keywords = ["sva", "systemverilog", "assertion", "rtl", "formal", "eda", "monitor", "synthesis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8.0",
    "jinja2>=3.1.6",
]

[project.urls]
Homepage = "https://github.com/VeriSymbolic-AI/sva2verilog"
Repository = "https://github.com/VeriSymbolic-AI/sva2verilog"
Issues = "https://github.com/VeriSymbolic-AI/sva2verilog/issues"

[project.scripts]
sva2rtl = "sva2rtl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sva2rtl"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "sva2rtl/templates"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/templates",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mutmut>=3.6.0",
    "mypy>=1.10",
    "pytest>=9.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN"]
ignore = ["N818"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.coverage.run]
source = ["src/sva2rtl"]
branch = true
omit = [
    "src/sva2rtl/__init__.py",
    "src/sva2rtl/formal_equiv.py",
    "src/sva2rtl/formal.py",
]

[tool.coverage.report]
# Phase 13 coverage target for fast CI tests (excludes formal modules
# which are only exercised by dedicated formal CI jobs).
# Baseline 2026-07-09: 78.5%. Updated 2026-07-11: 82.7% after P1-1
# real-source fixture E2E tests. Target trajectory: 82 → 85 → 90 → 95.
exclude_also = [
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 82

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "simulation: marks tests requiring iverilog (deselect with '-m not simulation')",
    "integration: marks end-to-end integration tests",
    "synthesis: marks generated RTL synthesis smoke tests",
    "generated_lint: marks generated RTL lint-only tests",
    "formal: marks tests requiring Yosys / SymbiYosys formal tools",
    "differential: marks bounded source-level oracle/simulator differential tests",
    "differential_slow: marks opt-in broader randomized differential sweeps",
]

[tool.mutmut]
source_paths = ["src/sva2rtl"]
only_mutate = [
    "src/sva2rtl/bool_semantics.py",
    "src/sva2rtl/ast_importer.py",
    "src/sva2rtl/composer.py",
    "src/sva2rtl/behavioral_oracle.py",
]
pytest_add_cli_args_test_selection = [
    "tests/",
    "-q",
    "--timeout=30",
    "--ignore=tests/simulation",
    "--ignore=tests/test_formal_sva_equiv.py",
    "--ignore=tests/test_v151_nfa_bmc.py",
    "--ignore=tests/test_v151_p2_bmc.py",
    "--ignore=tests/test_v151_p3_nested.py",
    "--ignore=tests/test_formal.py",
    "--ignore=tests/test_formal_harness_modes.py",
    "--ignore=tests/test_formal_kinduction.py",
    "--ignore=tests/test_formal_passes.py",
    "--ignore=tests/test_formal_templates.py",
    "--ignore=tests/test_synthesis_gates.py",
    "--ignore=tests/test_generated_lint.py",
]
timeout_multiplier = 20.0
mutate_only_covered_lines = true
