[project]
name = "sva2rtl"
version = "0.1.0"
description = "SVA to synthesizable RTL monitor compiler"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "jinja2>=3.1.6",
]

[project.scripts]
sva2rtl = "sva2rtl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sva2rtl"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=9.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
